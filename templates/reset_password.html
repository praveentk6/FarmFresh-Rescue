{% extends "base.html" %}

{% block title %}Set New Password - FarmFresh Rescue{% endblock %}

{% block content %}
<div class="auth-page-wrapper">
  <div class="auth-card">
    
    <!-- Header with Branding -->
    <div class="auth-header">
      <div class="auth-logo-badge">
        <span class="auth-leaf">🔐</span>
      </div>
      <h1 class="auth-title">Create New Password</h1>
      <p class="auth-subtitle">Account: <strong style="color: #15803d;">{{ email }}</strong></p>
    </div>

    <!-- Password Reset Form -->
    <form action="{{ url_for('reset_password_view', token=token) }}" method="POST" class="auth-form" id="resetPasswordForm">
      
      <div class="form-group">
        <label class="form-label" for="newPassword">New Password <span class="required">*</span></label>
        <div class="password-input-wrap">
          <input type="password" name="password" id="newPassword" class="form-control auth-input" placeholder="Min 6 characters" required autofocus minlength="6">
          <button type="button" class="btn-toggle-pw" onclick="togglePasswordVisibility('newPassword', this)" aria-label="Toggle password visibility">👁️</button>
        </div>
        <!-- Password Strength Meter -->
        <div class="pw-strength-meter" id="pwStrengthMeter">
          <div class="pw-strength-bars">
            <div class="bar" id="bar1"></div>
            <div class="bar" id="bar2"></div>
            <div class="bar" id="bar3"></div>
            <div class="bar" id="bar4"></div>
          </div>
          <span class="pw-strength-text" id="pwStrengthText">Password strength</span>
        </div>
      </div>

      <div class="form-group">
        <label class="form-label" for="confirmPassword">Confirm New Password <span class="required">*</span></label>
        <div class="password-input-wrap">
          <input type="password" name="confirm_password" id="confirmPassword" class="form-control auth-input" placeholder="Repeat new password" required minlength="6">
          <button type="button" class="btn-toggle-pw" onclick="togglePasswordVisibility('confirmPassword', this)" aria-label="Toggle password visibility">👁️</button>
        </div>
      </div>

      <button type="submit" class="btn btn-primary btn-block btn-lg auth-submit-btn" id="btnConfirmReset">
        <span>Save New Password &amp; Log In</span> &rarr;
      </button>

    </form>

    <div class="auth-footer">
      <p><a href="{{ url_for('login') }}" class="auth-link">&larr; Back to Login</a></p>
    </div>

  </div>
</div>

<script>
function togglePasswordVisibility(fieldId, btn) {
  const input = document.getElementById(fieldId);
  if (input) {
    if (input.type === 'password') {
      input.type = 'text';
      btn.textContent = '🙈';
    } else {
      input.type = 'password';
      btn.textContent = '👁️';
    }
  }
}

// Password Strength Calculator
const pwInput = document.getElementById('newPassword');
if (pwInput) {
  pwInput.addEventListener('input', function() {
    const val = this.value;
    let score = 0;
    if (val.length >= 6) score++;
    if (val.length >= 10) score++;
    if (/[A-Z]/.test(val) && /[a-z]/.test(val)) score++;
    if (/[0-9]/.test(val) || /[^A-Za-z0-9]/.test(val)) score++;

    const bar1 = document.getElementById('bar1');
    const bar2 = document.getElementById('bar2');
    const bar3 = document.getElementById('bar3');
    const bar4 = document.getElementById('bar4');
    const text = document.getElementById('pwStrengthText');

    [bar1, bar2, bar3, bar4].forEach(b => b.className = 'bar');

    if (score === 1) {
      bar1.classList.add('weak');
      text.textContent = 'Weak';
      text.style.color = '#ef4444';
    } else if (score === 2) {
      bar1.classList.add('fair');
      bar2.classList.add('fair');
      text.textContent = 'Fair';
      text.style.color = '#f59e0b';
    } else if (score === 3) {
      bar1.classList.add('good');
      bar2.classList.add('good');
      bar3.classList.add('good');
      text.textContent = 'Good';
      text.style.color = '#10b981';
    } else if (score >= 4) {
      bar1.classList.add('strong');
      bar2.classList.add('strong');
      bar3.classList.add('strong');
      bar4.classList.add('strong');
      text.textContent = 'Strong';
      text.style.color = '#059669';
    } else {
      text.textContent = 'Min 6 characters';
      text.style.color = '#94a3b8';
    }
  });
}
</script>
{% endblock %}
